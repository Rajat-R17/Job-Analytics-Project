<!DOCTYPE html>
<html lang="en">
<head>
    <title>Create Account - Job Market Analytics</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="split-auth-page">

    <!-- LEFT HERO -->
    <div class="auth-left-panel">
        <h1>Create Account</h1>
        <p>Join the Job Market Analytics platform and unlock live skills, salary, and city hiring insights.</p>
    </div>

    <!-- RIGHT SIGNUP FORM -->
    <div class="auth-right-panel">
        <div class="signin-card">
            <h2>Register</h2>
            <p>Create your analytics workspace</p>

            <form id="registerForm">
                <input type="text" id="registerName" placeholder="Full name" required>
                <input type="email" id="registerEmail" placeholder="Email address" required>
                <input type="password" id="registerPassword" placeholder="Password" required>

                <button type="submit" class="dark-btn">Create Account</button>
            </form>

            <p class="switch-link">
                Already have an account? <a href="signin.html">Sign in</a>
            </p>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
