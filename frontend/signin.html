<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sign In - Job Market Analytics</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="split-auth-page">

    <!-- LEFT SAME -->
    <div class="auth-left-panel">
        <h1>Welcome Back</h1>
        <p>Sign in to continue exploring live skills, salaries, and city hiring trends.</p>
    </div>

    <!-- RIGHT LOGIN FORM -->
    <div class="auth-right-panel">
        <div class="signin-card">
            <h2>Sign In</h2>
            <p>Continue to your analytics dashboard</p>

            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email address" required>
                <input type="password" id="loginPassword" placeholder="Password" required>

                <button type="submit" class="dark-btn">Login</button>
            </form>

            <p class="switch-link">
                New here? <a href="signup.html">Create account</a>
            </p>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
